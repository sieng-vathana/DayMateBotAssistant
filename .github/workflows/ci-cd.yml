name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B test

  deploy:
    name: Deploy to server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Copy jar and restart service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp target/daymate-bot-assistant.jar \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/daymate-bot-assistant.jar"
          ssh "${SERVER_USER}@${SERVER_HOST}" 'bash -s' <<'EOF'
            set -euo pipefail
            sudo mv /tmp/daymate-bot-assistant.jar /opt/daymate/daymate-bot-assistant.jar
            sudo chown daymate:daymate /opt/daymate/daymate-bot-assistant.jar
            sudo systemctl restart daymate
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 2 http://127.0.0.1:8000/health; then
                echo
                exit 0
              fi
              sleep 2
            done
            sudo journalctl -u daymate --no-pager -n 40
            exit 1
          EOF
