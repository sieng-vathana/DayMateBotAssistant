spring.application.name=DayMateBotAssistant
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.allowed-user-ids=${TELEGRAM_ALLOWED_USER_IDS:}
telegram.bot.admin-user-ids=${TELEGRAM_ADMIN_USER_IDS:}
telegram.bot.poll-timeout-seconds=${TELEGRAM_POLL_TIMEOUT_SECONDS:20}
telegram.bot.poll-delay-ms=${TELEGRAM_POLL_DELAY_MS:1000}
telegram.bot.timezone=${TELEGRAM_BOT_TIMEZONE:Asia/Phnom_Penh}
telegram.bot.digest-enabled=${TELEGRAM_DIGEST_ENABLED:false}
telegram.bot.digest-cron=${TELEGRAM_DIGEST_CRON:0 0 8 * * *}
telegram.bot.payday-reminder-cron=${TELEGRAM_PAYDAY_REMINDER_CRON:0 0 8-20 * * *}

spring.datasource.url=jdbc:h2:file:${DAYMATE_DATA_DIR:./data}/daymate-bot
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
